name: RAG quality gate

# 抄这份就能用：PR 里跑检索评测，退化了 PR 直接变红。
# 需要仓库里有：rag-gate.yaml、golden set、以及 baseline.json（已提交）。

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 rag-gate
        run: pip install rag-gate

      - name: 检索质量门禁（退化则 exit 1）
        id: gate
        run: rag-gate compare --config rag-gate.yaml --format markdown > comment.md
        continue-on-error: true

      - name: 把报告贴到 PR 评论
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          REPORT: comment.md
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.REPORT, 'utf8').slice(0, 60000);
            const marker = '<!-- rag-gate -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const previous = comments.data.find(c => c.body && c.body.includes(marker));
            const payload = `${marker}\n${body}`;
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body: payload });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: payload });
            }

      - name: 报告上传为 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-gate-report
          path: |
            comment.md
            .rag-gate/

      - name: 门禁结论
        if: steps.gate.outcome == 'failure'
        run: |
          echo "::error::检索质量退化，看上面的报告表（或 PR 评论）"
          exit 1
